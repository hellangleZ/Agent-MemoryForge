services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-16379}:6379"

  neo4j:
    image: neo4j:5
    ports:
      - "${NEO4J_HTTP_PORT:-17474}:7474"
      - "${NEO4J_BOLT_PORT:-17687}:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-agent_memory}
      - POSTGRES_USER=${POSTGRES_USER:-agent_memory}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-15432}:5432"

  embedding:
    build: .
    profiles: ["vector"]
    command: ["python", "-m", "uvicorn", "embedding_service:app", "--host", "0.0.0.0", "--port", "7999"]
    environment:
      - MODEL_PATH=${MODEL_PATH:-/models}
    volumes:
      - ${HOST_MODEL_PATH:-./models}:/models:ro
    ports:
      - "${EMBEDDING_PORT:-7999}:7999"

  memory:
    build: .
    command: ["python", "-m", "uvicorn", "agent_memory_service.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      - AGENT_MEMORY_BACKEND=file_first
      - AGENT_MEMORY_FILE_ROOT=/data/workspaces
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      - EMBEDDING_SERVICE_URL=http://embedding:7999/v1/embeddings
      - AGENT_MEMORY_SERVICE_API_KEY=${AGENT_MEMORY_SERVICE_API_KEY:?set AGENT_MEMORY_SERVICE_API_KEY}
      - AGENT_MEMORY_VECTOR_ENABLED=${AGENT_MEMORY_VECTOR_ENABLED:-0}
      - AGENT_MEMORY_VECTOR_BACKEND=pgvector
      - AGENT_MEMORY_VECTOR_ASYNC_INDEX=${AGENT_MEMORY_VECTOR_ASYNC_INDEX:-1}
      - AGENT_MEMORY_PGVECTOR_DSN=postgresql://${POSTGRES_USER:-agent_memory}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agent_memory}
      - AGENT_MEMORY_PGVECTOR_DIM=${AGENT_MEMORY_PGVECTOR_DIM:-1536}
    volumes:
      - memory_data:/data
    depends_on:
      - redis
      - neo4j
      - postgres
    expose:
      - "8001"

  gateway:
    build: .
    command: ["python", "-m", "uvicorn", "agent_runtime.product.agent_gateway:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      - APP_ENV=${APP_ENV:-development}
      - MEMORY_SERVICE_URL=http://memory:8001
      - AGENT_MEMORY_SERVICE_API_KEY=${AGENT_MEMORY_SERVICE_API_KEY:?set AGENT_MEMORY_SERVICE_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - AGENT_OBSERVABILITY_REDIS_ENABLED=${AGENT_OBSERVABILITY_REDIS_ENABLED:-1}
      - MEMORY_CLIENT_POOL_MAXSIZE=${MEMORY_CLIENT_POOL_MAXSIZE:-64}
      - AGENT_GATEWAY_HISTORY_ROUNDS=${AGENT_GATEWAY_HISTORY_ROUNDS:-10}
      - AGENT_GATEWAY_LLM_STREAMING=${AGENT_GATEWAY_LLM_STREAMING:-1}
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - OPENAI_API_VERSION=${OPENAI_API_VERSION:-}
      - OPENAI_API_STYLE=${OPENAI_API_STYLE:-auto}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT:-}
      - AZURE_OPENAI_MODEL=${AZURE_OPENAI_MODEL:-}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-}
      - AZURE_OPENAI_API_STYLE=${AZURE_OPENAI_API_STYLE:-}
      - AGENT_STEP_MODE_ENABLED=${AGENT_STEP_MODE_ENABLED:-0}
      - PREFERENCE_REQUIRE_CONFIRMATION=${PREFERENCE_REQUIRE_CONFIRMATION:-0}
      - MEMORY_DISTILL_ENABLED=${MEMORY_DISTILL_ENABLED:-1}
      - MEMORY_DISTILL_EVERY_N_ROUNDS=${MEMORY_DISTILL_EVERY_N_ROUNDS:-1}
      - MEMORY_DISTILL_PROVIDER=${MEMORY_DISTILL_PROVIDER:-}
      - MEMORY_DISTILL_MODEL=${MEMORY_DISTILL_MODEL:-}
      - MEMORY_DISTILL_TEMPERATURE=${MEMORY_DISTILL_TEMPERATURE:-0.2}
      - MEMORY_DISTILL_MAX_OUTPUT_TOKENS=${MEMORY_DISTILL_MAX_OUTPUT_TOKENS:-800}
      - MEMORY_DISTILL_TIMEOUT_S=${MEMORY_DISTILL_TIMEOUT_S:-45}
      - CONTEXT_PLANNER_ENABLED=${CONTEXT_PLANNER_ENABLED:-0}
      - CONTEXT_PLANNER_PROVIDER=${CONTEXT_PLANNER_PROVIDER:-openai-like}
      - CONTEXT_PLANNER_MODEL=${CONTEXT_PLANNER_MODEL:-}
      - CONTEXT_PLANNER_TEMPERATURE=${CONTEXT_PLANNER_TEMPERATURE:-0.1}
      - CONTEXT_PLANNER_MAX_OUTPUT_TOKENS=${CONTEXT_PLANNER_MAX_OUTPUT_TOKENS:-600}
      - CONTEXT_PLANNER_MAX_ATTEMPTS=${CONTEXT_PLANNER_MAX_ATTEMPTS:-6}
      - CONTEXT_PLANNER_RETRY_BASE_SLEEP_S=${CONTEXT_PLANNER_RETRY_BASE_SLEEP_S:-0.5}
      - CONTEXT_PLANNER_OPENAI_BASE_URL=${CONTEXT_PLANNER_OPENAI_BASE_URL:-}
      - CONTEXT_PLANNER_OPENAI_API_KEY=${CONTEXT_PLANNER_OPENAI_API_KEY:-}
      - CONTEXT_PLANNER_OPENAI_API_STYLE=${CONTEXT_PLANNER_OPENAI_API_STYLE:-}
      - CONTEXT_PLANNER_AZURE_OPENAI_ENDPOINT=${CONTEXT_PLANNER_AZURE_OPENAI_ENDPOINT:-}
      - CONTEXT_PLANNER_AZURE_OPENAI_API_KEY=${CONTEXT_PLANNER_AZURE_OPENAI_API_KEY:-}
      - CONTEXT_PLANNER_AZURE_OPENAI_DEPLOYMENT=${CONTEXT_PLANNER_AZURE_OPENAI_DEPLOYMENT:-}
      - CONTEXT_PLANNER_AZURE_OPENAI_API_VERSION=${CONTEXT_PLANNER_AZURE_OPENAI_API_VERSION:-}
      - EMBEDDING_SERVICE_URL=http://embedding:7999/v1/embeddings
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      - AGENT_GATEWAY_API_KEY=${AGENT_GATEWAY_API_KEY:?set AGENT_GATEWAY_API_KEY}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET}
      - AUTH_REFRESH_TOKEN_HASH_SECRET=${AUTH_REFRESH_TOKEN_HASH_SECRET:?set AUTH_REFRESH_TOKEN_HASH_SECRET}
      - PORTAL_SECRETS_KEY=${PORTAL_SECRETS_KEY:?set PORTAL_SECRETS_KEY}
      - AGENT_MEMORY_MCP_SERVERS=${AGENT_MEMORY_MCP_SERVERS:-}
      - NEON_API_KEY=${NEON_API_KEY:-}
      - SUPABASE_ACCESS_TOKEN=${SUPABASE_ACCESS_TOKEN:-}
    volumes:
      - ./.runtime:/app/.runtime
    depends_on:
      - memory
    ports:
      - "${GATEWAY_PORT:-8080}:8080"


  distill_worker:
    build: .
    command: ["python", "-m", "scripts.memory_distill_worker"]
    environment:
      - MEMORY_SERVICE_URL=http://memory:8001
      - AGENT_MEMORY_SERVICE_API_KEY=${AGENT_MEMORY_SERVICE_API_KEY:?set AGENT_MEMORY_SERVICE_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - MEMORY_DISTILL_ENABLED=${MEMORY_DISTILL_ENABLED:-1}
      - MEMORY_DISTILL_PROVIDER=${MEMORY_DISTILL_PROVIDER:-}
      - MEMORY_DISTILL_MODEL=${MEMORY_DISTILL_MODEL:-}
      - MEMORY_DISTILL_TEMPERATURE=${MEMORY_DISTILL_TEMPERATURE:-0.2}
      - MEMORY_DISTILL_MAX_OUTPUT_TOKENS=${MEMORY_DISTILL_MAX_OUTPUT_TOKENS:-800}
      - MEMORY_DISTILL_TIMEOUT_S=${MEMORY_DISTILL_TIMEOUT_S:-45}
      - MEMORY_DISTILL_LLM_MAX_ATTEMPTS=${MEMORY_DISTILL_LLM_MAX_ATTEMPTS:-8}
      - MEMORY_DISTILL_RETRY_BASE_SLEEP_S=${MEMORY_DISTILL_RETRY_BASE_SLEEP_S:-0.8}
      - MEMORY_DISTILL_TIMEOUT_S=${MEMORY_DISTILL_TIMEOUT_S:-45}
      - MEMORY_DISTILL_STORE_PREFERENCES=${MEMORY_DISTILL_STORE_PREFERENCES:-1}
      - MEMORY_DISTILL_PREFERENCE_REQUIRE_CONFIRMATION=${MEMORY_DISTILL_PREFERENCE_REQUIRE_CONFIRMATION:-0}
      - MEMORY_DISTILL_PREFERENCE_MIN_CONFIDENCE=${MEMORY_DISTILL_PREFERENCE_MIN_CONFIDENCE:-0.8}
      - MEMORY_DISTILL_OPENAI_BASE_URL=${MEMORY_DISTILL_OPENAI_BASE_URL:-}
      - MEMORY_DISTILL_OPENAI_API_KEY=${MEMORY_DISTILL_OPENAI_API_KEY:-}
      - MEMORY_DISTILL_OPENAI_API_STYLE=${MEMORY_DISTILL_OPENAI_API_STYLE:-}
      - MEMORY_DISTILL_AZURE_OPENAI_ENDPOINT=${MEMORY_DISTILL_AZURE_OPENAI_ENDPOINT:-}
      - MEMORY_DISTILL_AZURE_OPENAI_API_KEY=${MEMORY_DISTILL_AZURE_OPENAI_API_KEY:-}
      - MEMORY_DISTILL_AZURE_OPENAI_DEPLOYMENT=${MEMORY_DISTILL_AZURE_OPENAI_DEPLOYMENT:-}
      - MEMORY_DISTILL_AZURE_OPENAI_API_VERSION=${MEMORY_DISTILL_AZURE_OPENAI_API_VERSION:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - OPENAI_API_VERSION=${OPENAI_API_VERSION:-}
      - OPENAI_API_STYLE=${OPENAI_API_STYLE:-auto}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT:-}
      - AZURE_OPENAI_MODEL=${AZURE_OPENAI_MODEL:-}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-}
      - AZURE_OPENAI_API_STYLE=${AZURE_OPENAI_API_STYLE:-}
    depends_on:
      - redis
      - memory

  portal:
    build:
      context: ./portal-ui
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - NEXT_PUBLIC_API_BASE=${NEXT_PUBLIC_API_BASE:-}
      - NEXT_PUBLIC_PORTAL_PORT=${PORTAL_PORT:-3000}
      - NEXT_PUBLIC_SHOW_TOOL_TRACE=${NEXT_PUBLIC_SHOW_TOOL_TRACE:-0}
      - PORTAL_API_PROXY_TARGET=http://gateway:8080
    depends_on:
      - gateway
    ports:
      - "${PORTAL_PORT:-3000}:3000"

volumes:
  redis_data:
  neo4j_data:
  neo4j_logs:
  postgres_data:
  memory_data:
