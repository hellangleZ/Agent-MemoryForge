services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - internal
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - internal
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-agent_memory}
      - POSTGRES_USER=${POSTGRES_USER:-agent_memory}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped

  embedding:
    build: .
    command:
      - python
      - -m
      - uvicorn
      - embedding_service:app
      - --host
      - 0.0.0.0
      - --port
      - "7999"
    environment:
      - MODEL_PATH=/models
    volumes:
      - ${HOST_MODEL_PATH:?set HOST_MODEL_PATH to your onnx model folder}:/models:ro
    networks:
      - internal
    restart: unless-stopped

  memory:
    build: .
    command:
      - python
      - -m
      - uvicorn
      - agent_memory_service.app:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --workers
      - "${MEMORY_UVICORN_WORKERS:-2}"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      - EMBEDDING_SERVICE_URL=http://embedding:7999/v1/embeddings
      - AGENT_MEMORY_SERVICE_API_KEY=${AGENT_MEMORY_SERVICE_API_KEY:?set AGENT_MEMORY_SERVICE_API_KEY in .env}
      - AGENT_MEMORY_FILE_ROOT=/data/workspaces
      - AGENT_MEMORY_VECTOR_ENABLED=${AGENT_MEMORY_VECTOR_ENABLED:-1}
      - AGENT_MEMORY_VECTOR_BACKEND=pgvector
      - AGENT_MEMORY_VECTOR_ASYNC_INDEX=${AGENT_MEMORY_VECTOR_ASYNC_INDEX:-1}
      - AGENT_MEMORY_PGVECTOR_DSN=postgresql://${POSTGRES_USER:-agent_memory}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-agent_memory}
      - AGENT_MEMORY_PGVECTOR_DIM=${AGENT_MEMORY_PGVECTOR_DIM:-1536}
      # Markdown memory artifacts are persisted in /data/workspaces.
    volumes:
      - memory_data:/data
    networks:
      - internal
    depends_on:
      - redis
      - neo4j
      - postgres
      - embedding
    restart: unless-stopped

  gateway:
    build: .
    command:
      - python
      - -m
      - uvicorn
      - agent_runtime.product.agent_gateway:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --workers
      - "${GATEWAY_UVICORN_WORKERS:-2}"
    environment:
      - APP_ENV=production
      - MEMORY_SERVICE_URL=http://memory:8001
      - AGENT_MEMORY_SERVICE_API_KEY=${AGENT_MEMORY_SERVICE_API_KEY:?set AGENT_MEMORY_SERVICE_API_KEY in .env}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - AGENT_OBSERVABILITY_REDIS_ENABLED=${AGENT_OBSERVABILITY_REDIS_ENABLED:-1}
      - MEMORY_CLIENT_POOL_MAXSIZE=${MEMORY_CLIENT_POOL_MAXSIZE:-128}
      - AGENT_GATEWAY_HISTORY_ROUNDS=${AGENT_GATEWAY_HISTORY_ROUNDS:-10}
      - AGENT_GATEWAY_LLM_STREAMING=${AGENT_GATEWAY_LLM_STREAMING:-1}
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - OPENAI_API_VERSION=${OPENAI_API_VERSION:-}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT:-}
      - AZURE_OPENAI_MODEL=${AZURE_OPENAI_MODEL:-}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-}
      - AGENT_STEP_MODE_ENABLED=${AGENT_STEP_MODE_ENABLED:-0}
      - PREFERENCE_REQUIRE_CONFIRMATION=${PREFERENCE_REQUIRE_CONFIRMATION:-0}
      - MEMORY_DISTILL_ENABLED=${MEMORY_DISTILL_ENABLED:-1}
      - MEMORY_DISTILL_EVERY_N_ROUNDS=${MEMORY_DISTILL_EVERY_N_ROUNDS:-1}
      - MEMORY_DISTILL_PROVIDER=${MEMORY_DISTILL_PROVIDER:-}
      - MEMORY_DISTILL_MODEL=${MEMORY_DISTILL_MODEL:-}
      - MEMORY_DISTILL_TEMPERATURE=${MEMORY_DISTILL_TEMPERATURE:-0.2}
      - MEMORY_DISTILL_MAX_OUTPUT_TOKENS=${MEMORY_DISTILL_MAX_OUTPUT_TOKENS:-800}
      - MEMORY_DISTILL_TIMEOUT_S=${MEMORY_DISTILL_TIMEOUT_S:-45}
      - EMBEDDING_SERVICE_URL=http://embedding:7999/v1/embeddings
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      - AGENT_GATEWAY_API_KEY=${AGENT_GATEWAY_API_KEY:?set AGENT_GATEWAY_API_KEY in .env}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in .env}
      - AUTH_REFRESH_TOKEN_HASH_SECRET=${AUTH_REFRESH_TOKEN_HASH_SECRET:?set AUTH_REFRESH_TOKEN_HASH_SECRET in .env}
      - PORTAL_SECRETS_KEY=${PORTAL_SECRETS_KEY:?set PORTAL_SECRETS_KEY in .env}
      # Strongly recommended: keep control plane disabled in prod.
      - FULL_CHAIN_CONTROL_ENABLED=0
    volumes:
      - ./.runtime:/app/.runtime
    networks:
      - internal
    depends_on:
      - memory
    restart: unless-stopped


  distill_worker:
    build: .
    command:
      - python
      - -m
      - scripts.memory_distill_worker
    environment:
      - MEMORY_SERVICE_URL=http://memory:8001
      - AGENT_MEMORY_SERVICE_API_KEY=${AGENT_MEMORY_SERVICE_API_KEY:?set AGENT_MEMORY_SERVICE_API_KEY in .env}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - MEMORY_DISTILL_ENABLED=${MEMORY_DISTILL_ENABLED:-1}
      - MEMORY_DISTILL_PROVIDER=${MEMORY_DISTILL_PROVIDER:-}
      - MEMORY_DISTILL_MODEL=${MEMORY_DISTILL_MODEL:-}
      - MEMORY_DISTILL_TEMPERATURE=${MEMORY_DISTILL_TEMPERATURE:-0.2}
      - MEMORY_DISTILL_MAX_OUTPUT_TOKENS=${MEMORY_DISTILL_MAX_OUTPUT_TOKENS:-800}
      - MEMORY_DISTILL_TIMEOUT_S=${MEMORY_DISTILL_TIMEOUT_S:-45}
      - MEMORY_DISTILL_LLM_MAX_ATTEMPTS=${MEMORY_DISTILL_LLM_MAX_ATTEMPTS:-8}
      - MEMORY_DISTILL_RETRY_BASE_SLEEP_S=${MEMORY_DISTILL_RETRY_BASE_SLEEP_S:-0.8}
      - MEMORY_DISTILL_TIMEOUT_S=${MEMORY_DISTILL_TIMEOUT_S:-45}
      - MEMORY_DISTILL_STORE_PREFERENCES=${MEMORY_DISTILL_STORE_PREFERENCES:-1}
      - MEMORY_DISTILL_PREFERENCE_REQUIRE_CONFIRMATION=${MEMORY_DISTILL_PREFERENCE_REQUIRE_CONFIRMATION:-0}
      - MEMORY_DISTILL_PREFERENCE_MIN_CONFIDENCE=${MEMORY_DISTILL_PREFERENCE_MIN_CONFIDENCE:-0.8}
      - MEMORY_DISTILL_OPENAI_BASE_URL=${MEMORY_DISTILL_OPENAI_BASE_URL:-}
      - MEMORY_DISTILL_OPENAI_API_KEY=${MEMORY_DISTILL_OPENAI_API_KEY:-}
      - MEMORY_DISTILL_AZURE_OPENAI_ENDPOINT=${MEMORY_DISTILL_AZURE_OPENAI_ENDPOINT:-}
      - MEMORY_DISTILL_AZURE_OPENAI_API_KEY=${MEMORY_DISTILL_AZURE_OPENAI_API_KEY:-}
      - MEMORY_DISTILL_AZURE_OPENAI_DEPLOYMENT=${MEMORY_DISTILL_AZURE_OPENAI_DEPLOYMENT:-}
      - MEMORY_DISTILL_AZURE_OPENAI_API_VERSION=${MEMORY_DISTILL_AZURE_OPENAI_API_VERSION:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - OPENAI_API_VERSION=${OPENAI_API_VERSION:-}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT:-}
      - AZURE_OPENAI_MODEL=${AZURE_OPENAI_MODEL:-}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-}
    networks:
      - internal
    depends_on:
      - redis
      - memory
    restart: unless-stopped

  # Reverse proxy (TLS termination).
  # For real production, prefer managing certificates via your infra.
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    depends_on:
      - gateway
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  redis_data:
  neo4j_data:
  neo4j_logs:
  postgres_data:
  memory_data:
  caddy_data:
  caddy_config:
